spring.application.name=school-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/school}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.response-mime-type=application/json

server.port=8080

security.jwt.access-token-minutes=15
security.jwt.refresh-token-days=7
security.jwt.private-key=${JWT_PRIVATE_KEY:}
security.jwt.public-key=${JWT_PUBLIC_KEY:}

school.admin.username=${ADMIN_USERNAME:}
school.admin.email=${ADMIN_EMAIL:}
school.admin.password=${ADMIN_PASSWORD:}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:school-temporary}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.org.springframework.security=INFO
logging.level.ml.school=INFO
